[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-agent"
version = "0.1.0"
description = "Seed Agent framework with skill loading capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Seed Team"}
]
dependencies = [
    "fastapi>=0.136.0",
    "httpx>=0.28.0",
    "json_repair>=0.59.0",
    "loguru>=0.7.0",
    "openai>=2.32.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "uvicorn>=0.46.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["seed_agent*", "seed_ai*"]
exclude = ["tests*"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
